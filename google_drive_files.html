<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMDR Archive — Google Drive Files</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#004080;--primary-dark:#003060;--primary-light:#0060a0;
  --accent:#ffc107;--accent-dark:#e0a800;
  --success:#28a745;--danger:#dc3545;
  --gray-100:#f0f4f8;--gray-200:#e2e8f0;--gray-400:#94a3b8;--gray-600:#475569;--gray-800:#1e293b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Source Sans Pro',Arial,sans-serif;background:#fff;color:var(--gray-800);}
.wrap{max-width:1000px;margin:0 auto;padding:20px;}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.header h1{font-family:'Oswald',sans-serif;font-size:1.3rem;color:var(--primary);}
.header p{font-size:.8rem;color:var(--gray-600);}
.mode-badge{font-size:.7rem;font-weight:700;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:var(--gray-100);color:var(--gray-600);}
.mode-badge.admin{background:rgba(255,193,7,.25);color:#8a6100;}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.btn{padding:9px 16px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Oswald',sans-serif;text-transform:uppercase;border:2px solid transparent;display:inline-flex;align-items:center;gap:6px;}
.btn-gold{background:var(--accent);border-color:var(--accent);color:#000;}
.btn-gold:hover{background:var(--accent-dark);}
.btn-outline{background:#fff;border-color:var(--primary);color:var(--primary);}
.btn-outline:hover{background:var(--gray-100);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);padding:5px 10px;font-size:.7rem;}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 12px;background:var(--gray-100);border-radius:8px;margin-bottom:16px;font-size:.85rem;}
.crumb{cursor:pointer;color:var(--primary);font-weight:600;}
.crumb:hover{text-decoration:underline;}
.crumb-sep{color:var(--gray-400);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.card{border:2px solid var(--gray-200);border-radius:10px;padding:14px;transition:border-color .2s;}
.card:hover{border-color:var(--primary-light);}
.card-folder{cursor:pointer;background:#f8fafc;}
.card-icon{font-size:1.6rem;margin-bottom:6px;}
.card-name{font-weight:600;font-size:.9rem;word-break:break-word;}
.card-desc{font-size:.75rem;color:var(--gray-600);margin-top:4px;}
.card-meta{font-size:.7rem;color:var(--gray-400);margin-top:6px;}
.card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.card-actions .btn{padding:5px 10px;font-size:.7rem;}

.empty-state{text-align:center;padding:50px 20px;color:var(--gray-600);}
.loading{text-align:center;padding:40px;color:var(--gray-600);font-size:.9rem;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:500;padding:15px;}
.modal-overlay.active{display:flex;}
.modal{background:#fff;border-radius:12px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.modal-header{background:var(--primary);color:#fff;padding:14px 18px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;}
.modal-header h2{font-family:'Oswald',sans-serif;font-size:1.05rem;}
.modal-close{background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;}
.modal-body{padding:18px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-weight:600;margin-bottom:5px;font-size:.85rem;}
.form-group input{width:100%;padding:10px 12px;border:2px solid var(--gray-200);border-radius:6px;font-family:inherit;font-size:.9rem;}
.modal-footer{padding:14px 18px;border-top:1px solid var(--gray-200);display:flex;gap:8px;justify-content:flex-end;}
.progress-bar{height:8px;background:var(--gray-200);border-radius:4px;overflow:hidden;margin-top:8px;display:none;}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .2s;}

.notification{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);padding:12px 24px;border-radius:8px;font-weight:600;z-index:600;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 5px 20px rgba(0,0,0,.3);font-size:.85rem;}
.notification.show{opacity:1;transform:translateX(-50%) translateY(0);}
.notification.success{background:#d4edda;color:#155724;}
.notification.error{background:#f8d7da;color:#721c24;}
.icon-inline{display:inline-flex;vertical-align:-3px;margin-right:4px;}
.icon-inline svg{display:block;}

.present-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:700;padding:20px;}
.present-overlay.active{display:flex;}
.present-box{background:#fff;border-radius:10px;width:100%;max-width:1000px;height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.present-bar{background:var(--primary);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.present-bar span{font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.present-bar button{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.present-bar button:hover{background:rgba(255,255,255,.3);}
.present-box iframe{flex:1;width:100%;border:none;}
.present-hint{background:var(--gray-100);color:var(--gray-600);font-size:.75rem;padding:6px 16px;text-align:center;flex-shrink:0;}
</style>
</head>
<body>

<script>
const ICONS = {
  folder: '<span class="icon-inline"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg></span>',
  folderBig: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>',
  file: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  upload: '<span class="icon-inline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>',
  refresh: '<span class="icon-inline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span>',
  home: '<span class="icon-inline"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>',
  close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
};

function getFileIcon(mimeType, name) {
  mimeType = mimeType || '';
  name = (name || '').toLowerCase();
  let type = null;

  if (mimeType.includes('pdf') || name.endsWith('.pdf')) type = { color: '#dc3545', label: 'PDF' };
  else if (mimeType.includes('wordprocessingml') || mimeType === 'application/msword' || name.endsWith('.docx') || name.endsWith('.doc')) type = { color: '#2b579a', label: 'DOC' };
  else if (mimeType.includes('presentationml') || mimeType === 'application/vnd.ms-powerpoint' || name.endsWith('.pptx') || name.endsWith('.ppt')) type = { color: '#d24726', label: 'PPT' };
  else if (mimeType.includes('spreadsheetml') || mimeType === 'application/vnd.ms-excel' || name.endsWith('.xlsx') || name.endsWith('.xls')) type = { color: '#217346', label: 'XLS' };
  else if (mimeType.startsWith('image/')) type = { color: '#6f42c1', label: 'IMG' };
  else if (mimeType.includes('zip') || name.endsWith('.zip')) type = { color: '#94a3b8', label: 'ZIP' };
  else if (mimeType.startsWith('text/csv') || name.endsWith('.csv')) type = { color: '#217346', label: 'CSV' };

  if (!type) {
    return '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  }
  return '<svg width="28" height="28" viewBox="0 0 24 24">' +
    '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="' + type.color + '"/>' +
    '<polyline points="14 2 14 8 20 8" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1"/>' +
    '<text x="12" y="18" font-size="6.5" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">' + type.label + '</text>' +
    '</svg>';
}
</script>

<div class="wrap">
  <div class="header">
    <div>
      <h1><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:6px;"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>NMDR Archive — Google Drive Files</h1>
      <p>Policy documents, strategic plans, campaign files and reports</p>
    </div>
    <span class="mode-badge" id="modeBadge">Loading…</span>
  </div>

  <div class="toolbar" id="adminToolbar" style="display:none;">
    <button class="btn btn-gold" onclick="openCreateFolderModal()">+ New Folder</button>
    <button class="btn btn-primary" onclick="triggerUpload()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload File</button>
    <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelected(this)">
  </div>

  <div class="toolbar">
    <button class="btn btn-outline" onclick="loadFolder(currentFolderId)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>Refresh</button>
  </div>

  <div class="breadcrumb" id="breadcrumb"></div>

  <div id="content"><div class="loading">Loading folder contents…</div></div>
</div>

<!-- Create Folder Modal -->
<div class="modal-overlay" id="createFolderModal">
  <div class="modal">
    <div class="modal-header"><h2>Create New Folder</h2><button class="modal-close" onclick="closeCreateFolderModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div class="form-group"><label>Folder Name</label><input type="text" id="newFolderName" placeholder="e.g., Q1 Reports"></div>
      <div class="form-group"><label>Description (optional)</label><input type="text" id="folderDescription" placeholder="Brief description"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeCreateFolderModal()">Cancel</button>
      <button class="btn btn-gold" onclick="submitCreateFolder()">Create</button>
    </div>
  </div>
</div>

<!-- Upload progress -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <div class="modal-header"><h2>Uploading File</h2></div>
    <div class="modal-body">
      <p id="uploadFileName" style="font-size:.85rem;color:var(--gray-600);"></p>
      <div class="progress-bar" style="display:block;"><div class="progress-fill" id="uploadProgressFill"></div></div>
    </div>
  </div>
</div>

<!-- Inline Presentation Viewer -->
<div class="present-overlay" id="presentOverlay">
  <div class="present-box">
    <div class="present-bar">
      <span id="presentFileName"></span>
      <button onclick="closePresentModal()" title="Close">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <iframe id="presentFrame" src=""></iframe>
    <div class="present-hint">Hover over the slide to use Google's Back / Next arrows, or use the arrow keys</div>
  </div>
</div>

<script>
// ===== CONFIG =====
// Paste the /exec URL from your Apps Script deployment here
const ARCHIVE_API = 'https://script.google.com/macros/s/AKfycbzldbnSFplB5qltv41i6vv6-huN934Nxxyr7uGB4qVH9bWxf2gT5fWL-IS_F3fQ8mx2/exec';

// Admin status inherited from the NMDR portal login. The portal passes the
// role as ?role=admin when it loads this page into its iframe; falls back to
// localStorage nmdrRole for portal builds that persist role that way, and
// defaults to view-only if opened standalone with neither present.
const urlRole = new URLSearchParams(window.location.search).get('role');
const isAdmin = (urlRole === 'admin') || (!urlRole && localStorage.getItem('nmdrRole') === 'admin');

let currentFolderId = null; // null until first list() tells us the root id
let pathStack = []; // [{id, name}]

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('modeBadge').textContent = isAdmin ? 'Admin — full access' : 'View & download';
  document.getElementById('modeBadge').className = 'mode-badge' + (isAdmin ? ' admin' : '');
  if (isAdmin) document.getElementById('adminToolbar').style.display = 'flex';
  loadFolder(null);
});

async function loadFolder(folderId) {
  document.getElementById('content').innerHTML = '<div class="loading">Loading folder contents…</div>';
  try {
    const url = ARCHIVE_API + '?action=list' + (folderId ? '&folderId=' + encodeURIComponent(folderId) : '');
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) { showNotification(data.error, 'error'); return; }

    currentFolderId = data.folderId;
    if (!pathStack.length || pathStack[pathStack.length - 1].id !== data.folderId) {
      // only push if we navigated forward; breadcrumb clicks handle backward trimming themselves
    }
    renderBreadcrumb(data.isRoot);
    renderContents(data);
  } catch (err) {
    const attemptedFolder = folderId;
    document.getElementById('content').innerHTML =
      '<div class="empty-state">Could not reach the archive. Check ARCHIVE_API is set to your deployed Apps Script URL.' +
      '<br><br><button class="btn btn-gold" id="retryLoadBtn">' + ICONS.refresh + 'Try Again</button></div>';
    document.getElementById('retryLoadBtn').addEventListener('click', function () { loadFolder(attemptedFolder); });
  }
}

function openFolder(id, name) {
  pathStack.push({ id, name });
  loadFolder(id);
}

function renderBreadcrumb(isRoot) {
  const el = document.getElementById('breadcrumb');
  let html = `<span class="crumb" onclick="goToRoot()">${ICONS.home}Root</span>`;
  pathStack.forEach((p, i) => {
    html += `<span class="crumb-sep">›</span><span class="crumb" onclick="goToCrumb(${i})">${escapeHtml(p.name)}</span>`;
  });
  el.innerHTML = html;
}

function goToRoot() {
  pathStack = [];
  loadFolder(null);
}

function goToCrumb(index) {
  pathStack = pathStack.slice(0, index + 1);
  loadFolder(pathStack[index].id);
}

function renderContents(data) {
  const el = document.getElementById('content');
  if (!data.folders.length && !data.files.length) {
    el.innerHTML = '<div class="empty-state">This folder is empty.' + (isAdmin ? ' Use New Folder or Upload File above.' : '') + '</div>';
    return;
  }
  let html = '<div class="grid">';
  data.folders.forEach(f => {
    html += `<div class="card card-folder" onclick="openFolder('${f.id}','${escapeHtml(f.name).replace(/'/g, "\\'")}')">
      <div class="card-icon">${ICONS.folderBig}</div>
      <div class="card-name">${escapeHtml(f.name)}</div>
      ${f.description ? `<div class="card-desc">${escapeHtml(f.description)}</div>` : ''}
      ${isAdmin ? `<div class="card-actions"><button class="btn btn-danger" onclick="event.stopPropagation();removeFolder('${f.id}')">Delete</button></div>` : ''}
    </div>`;
  });
  data.files.forEach(f => {
    html += `<div class="card">
      <div class="card-icon">${getFileIcon(f.mimeType, f.name)}</div>
      <div class="card-name">${escapeHtml(f.name)}</div>
      <div class="card-meta">${formatSize(f.size)} · ${formatDate(f.createdAt)}</div>
      <div class="card-actions">
        ${isPresentable(f.mimeType, f.name)
          ? `<button class="btn btn-outline" onclick="openPresentModal('${f.id}','${escapeHtml(f.name).replace(/'/g, "\\'")}')">Present</button>`
          : `<button class="btn btn-outline" onclick="window.open('${f.viewUrl}','_blank')">View</button>`}
        <button class="btn btn-primary" onclick="window.open('${f.downloadUrl}','_blank')">Download</button>
        ${isAdmin ? `<button class="btn btn-danger" onclick="removeFile('${f.id}')">Delete</button>` : ''}
      </div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

// ===== Create folder =====
function openCreateFolderModal() {
  document.getElementById('newFolderName').value = '';
  document.getElementById('folderDescription').value = '';
  document.getElementById('createFolderModal').classList.add('active');
}
function closeCreateFolderModal() {
  document.getElementById('createFolderModal').classList.remove('active');
}
async function submitCreateFolder() {
  const name = document.getElementById('newFolderName').value.trim();
  if (!name) { showNotification('Folder name required', 'error'); return; }
  const description = document.getElementById('folderDescription').value.trim();
  try {
    const res = await fetch(ARCHIVE_API, {
      method: 'POST',
      body: JSON.stringify({ action: 'createFolder', parentId: currentFolderId, name, description })
    });
    const data = await res.json();
    if (data.error) { showNotification(data.error, 'error'); return; }
    closeCreateFolderModal();
    showNotification(`Folder "${name}" created`, 'success');
    loadFolder(currentFolderId);
  } catch (err) {
    showNotification('Could not create folder', 'error');
  }
}

// ===== Upload file =====
function triggerUpload() {
  document.getElementById('fileInput').click();
}
function handleFileSelected(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function () {
    const base64Data = reader.result.split(',')[1];
    document.getElementById('uploadFileName').textContent = file.name;
    document.getElementById('uploadModal').classList.add('active');
    try {
      const res = await fetch(ARCHIVE_API, {
        method: 'POST',
        body: JSON.stringify({
          action: 'uploadFile',
          folderId: currentFolderId,
          fileName: file.name,
          mimeType: file.type,
          base64Data
        })
      });
      const data = await res.json();
      document.getElementById('uploadModal').classList.remove('active');
      if (data.error) { showNotification(data.error, 'error'); return; }
      showNotification(`"${file.name}" uploaded`, 'success');
      loadFolder(currentFolderId);
    } catch (err) {
      document.getElementById('uploadModal').classList.remove('active');
      showNotification('Upload failed', 'error');
    }
    input.value = '';
  };
  reader.readAsDataURL(file);
}

// ===== Delete =====
async function removeFolder(id) {
  if (!confirm('Delete this folder and everything inside it?')) return;
  const res = await fetch(ARCHIVE_API, { method: 'POST', body: JSON.stringify({ action: 'deleteFolder', folderId: id }) });
  const data = await res.json();
  if (data.error) { showNotification(data.error, 'error'); return; }
  showNotification('Folder deleted', 'success');
  loadFolder(currentFolderId);
}
async function removeFile(id) {
  if (!confirm('Delete this file?')) return;
  const res = await fetch(ARCHIVE_API, { method: 'POST', body: JSON.stringify({ action: 'deleteFile', fileId: id }) });
  const data = await res.json();
  if (data.error) { showNotification(data.error, 'error'); return; }
  showNotification('File deleted', 'success');
  loadFolder(currentFolderId);
}

// ===== Inline presentation viewer =====
function isPresentable(mimeType, name) {
  mimeType = mimeType || ''; name = (name || '').toLowerCase();
  return mimeType.includes('presentationml') || mimeType === 'application/vnd.ms-powerpoint' ||
         mimeType === 'application/vnd.google-apps.presentation' || name.endsWith('.pptx') || name.endsWith('.ppt');
}
function openPresentModal(fileId, fileName) {
  document.getElementById('presentFileName').textContent = fileName;
  document.getElementById('presentFrame').src = 'https://drive.google.com/file/d/' + fileId + '/preview';
  document.getElementById('presentOverlay').classList.add('active');
}
function closePresentModal() {
  document.getElementById('presentOverlay').classList.remove('active');
  document.getElementById('presentFrame').src = '';
}

// ===== Helpers =====
function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function formatDate(d) { if (!d) return ''; return new Date(d).toLocaleDateString(); }
function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}
function showNotification(msg, type) {
  const n = document.createElement('div');
  n.className = `notification ${type} show`;
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 3000);
}
</script>
